<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">

    <title>Prueba Brazo Robótico XR</title>

    <script src="https://cdn.jsdelivr.net/npm/aframe@1.4.1/dist/aframe-master.min.js"></script>
</head>

<body>

<a-scene>

    <!-- ========================= -->
    <!-- CARGA DEL MODELO GLB -->
    <!-- ========================= -->

    <a-assets>

        <a-asset-item
            id="modelo-brazo"
            src="brazo_robotico.glb">
        </a-asset-item>

    </a-assets>


    <!-- ========================= -->
    <!-- PISO -->
    <!-- ========================= -->

    <a-plane
        rotation="-90 0 0"
        width="14"
        height="14"
        color="#555555">
    </a-plane>


    <!-- ========================= -->
    <!-- BANDA TRANSPORTADORA -->
    <!-- ========================= -->

    <a-box
        position="0 0.7 -3"
        width="7"
        height="0.4"
        depth="1.5"
        color="#333333">
    </a-box>


    <!-- Rodillos -->

    <a-cylinder
        position="-2.8 0.95 -3"
        rotation="0 0 90"
        radius="0.35"
        height="1.4"
        color="#AAAAAA">
    </a-cylinder>

    <a-cylinder
        position="2.8 0.95 -3"
        rotation="0 0 90"
        radius="0.35"
        height="1.4"
        color="#AAAAAA">
    </a-cylinder>


    <!-- ========================= -->
    <!-- PIEZAS SOBRE LA BANDA -->
    <!-- ========================= -->

    <a-box
        position="-1.5 1.3 -3"
        width="0.8"
        height="0.8"
        depth="0.8"
        color="#8B4513">
    </a-box>

    <a-box
        position="0 1.3 -3"
        width="0.8"
        height="0.8"
        depth="0.8"
        color="#8B4513">
    </a-box>

    <a-box
        position="1.5 1.3 -3"
        width="0.8"
        height="0.8"
        depth="0.8"
        color="#8B4513">
    </a-box>


    <!-- ========================= -->
    <!-- BRAZO ROBÓTICO -->
    <!-- ========================= -->

    <a-entity
        id="brazo-robotico"
        gltf-model="#modelo-brazo"
        position="3 0 -3"
        rotation="0 0 0"
        scale="0.01 0.01 0.01">
    </a-entity>


    <!-- ========================= -->
    <!-- CIELO -->
    <!-- ========================= -->

    <a-sky color="#ECECEC"></a-sky>


</a-scene>

</body>

</html>
